name: Release

# Publishes the three @drvillo/moltpoker-* packages owned by this repo to npm
# using npm trusted publishing (OIDC). Each package is released independently
# so their versions can diverge (e.g. agents@0.3.0 but sdk@0.2.7).
#
# Trigger: push a tag matching `<pkg>@v<version>`, where <pkg> is one of
# `sdk`, `agents`, or `simulator`. Example:
#   git tag -s sdk@v0.2.7 -m "Release @drvillo/moltpoker-sdk@0.2.7"
#   git push origin sdk@v0.2.7
#
# When releasing a dependency chain in the same cut, tag and push in
# dependency order:
#   1. sdk@v0.2.7        (shared is in moltpoker-engine; publish that first)
#   2. agents@v0.3.0
#   3. simulator@v0.3.0
#
# Pre-release checklist (done by a maintainer BEFORE tagging):
# 1. Bump the target packages/<pkg>/package.json.
# 2. Update packages/<pkg>/CHANGELOG.md.
# 3. REMOVE the pnpm.overrides block from package.json and regenerate
#    pnpm-lock.yaml with `pnpm install --no-frozen-lockfile`. The lockfile
#    MUST resolve to npm-published @drvillo/moltpoker-shared and -poker.
# 4. Commit, push, PR, merge, then tag and push the tag.
#
# See RELEASING.md for the one-time npm trusted-publisher setup.

on:
  push:
    tags:
      - "sdk@v*.*.*"
      - "agents@v*.*.*"
      - "simulator@v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. sdk@v0.2.7). Must match package.json version."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build / Test / Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Parse tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          PKG="${TAG%%@v*}"
          VERSION="${TAG#*@v}"
          case "$PKG" in
            sdk|agents|simulator) ;;
            *) echo "::error::Unknown package '$PKG' in tag '$TAG'. Expected sdk | agents | simulator."; exit 1 ;;
          esac
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$PKG" >> "$GITHUB_OUTPUT"
          echo "Resolved release: pkg=$PKG version=$VERSION"

      - name: Refuse to publish if cross-repo overrides are present
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json');process.exit(p.pnpm && p.pnpm.overrides ? 1 : 0)"; then
            echo "OK: no pnpm.overrides in package.json"
          else
            echo "::error::package.json still has pnpm.overrides pointing at local engine tarballs. Remove them and regenerate pnpm-lock.yaml before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.tag.outputs.version }}"
          ACTUAL=$(node -p "require('./${{ steps.tag.outputs.dir }}/package.json').version")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error file=${{ steps.tag.outputs.dir }}/package.json::version mismatch: got '$ACTUAL', expected '$EXPECTED' from tag ${{ steps.tag.outputs.pkg }}@v$EXPECTED"
            exit 1
          fi
          echo "OK: ${{ steps.tag.outputs.dir }} is at $ACTUAL"

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Publish @drvillo/moltpoker-${{ steps.tag.outputs.pkg }}
        working-directory: ${{ steps.tag.outputs.dir }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --provenance --access public --tag latest
